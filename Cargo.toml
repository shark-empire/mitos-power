[package]
name = "mitos-power"
version = "0.1.0"
edition = "2021"
description = "MITOS central power-management daemon"
license = "MIT"
authors = ["MITOS Project"]
default-run = "mitos-power"

# Shared code (protocol types, managers, hardware access) lives in src/lib.rs
# so that both binaries below can depend on the exact same types instead of
# duplicating the IPC protocol. This is one deliberate deviation from the
# spec's file tree (which only listed src/main.rs) -- see README.md.
[lib]
name = "mitos_power"
path = "src/lib.rs"

[[bin]]
name = "mitos-power"
path = "src/main.rs"

[[bin]]
name = "mitos-powerctl"
path = "bin/mitos-powerctl.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

# Netlink/kobject hotplug monitoring (battery, AC power_supply add/change/remove).
udev = "0.8"

# Live key/switch events -- power button, lid switch, brightness hotkeys.
# uevents (above) only cover hotplug, not individual keypresses/switch
# toggles, so this is a separate, necessary dependency. Same caveat as
# udev: confident in the general shape of this crate's API
# (enumerate/supported_switches/supported_keys/fetch_events) but not
# pinned to one exact version's method signatures -- see
# src/hardware/evdev.rs and audit.md.
evdev = "0.12"

# Raw reboot(2)/sync(2) syscalls for shutdown/reboot/poweroff, signalling
# PID 1 for the supervised shutdown path (`signal`/`process`), and
# peer-group lookups for IPC permission checks. Version and feature list
# deliberately match mitos-session's (0.29) so both daemons resolve one
# nix. NOTE: nix's feature-flag names have moved around across releases --
# if `cargo build` complains about a missing feature, check
# `cargo add nix --features reboot,user,fs,signal,process` for the version
# that actually resolves and adjust this list.
nix = { version = "0.29", features = ["reboot", "user", "fs", "signal", "process"] }

# Wire format of mitos-session's IPC (length-prefixed bincode). Pinned to
# the same 1.3 series mitos-session uses -- see src/session_client/protocol.rs
# for why matching Rust types is what makes the two sides compatible.
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
